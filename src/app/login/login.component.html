<div class="login">
    <div class="login-section shadow">
        <div class="login-section-inner">
            <!-- Nav Pills for Email and OTP Selection -->
            <ul class="nav nav-pills mb-3 d-none" id="loginTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <a class="nav-link active" id="email-tab" data-bs-toggle="pill" href="#email" role="tab"
                        aria-controls="email" aria-selected="true">Email</a>
                </li>
                <li class="nav-item" role="presentation">
                    <a class="nav-link" id="otp-tab" data-bs-toggle="pill" href="#otp" role="tab" aria-controls="otp"
                        aria-selected="false">OTP</a>
                </li>
            </ul>
            <!-- Tab Content for Email and OTP -->
            <div class="tab-content" id="loginTabsContent">
                <!-- Email Login Form -->
                <div class="tab-pane fade show active" id="email" role="tabpanel" aria-labelledby="email-tab">
                    <div class="col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-sm-12 col-xs-12">
                        <h1 class="login-headding">Login</h1>
                    </div>
                    <form name="form" #f="ngForm" (ngSubmit)="f.form.valid 
                        && login(userData)">
                        <div class="mb-3">
                            <label for="email">Email : </label>
                            <input type="text" class="form-control" name="username" [(ngModel)]="userData.username"
                                autocomplete="username" #username="ngModel" required />
                        </div>
                        <div class="">
                            <label for="password">Password : </label>
                            <div class="input-group">
                                <input type="password" name="password" class="form-control" placeholder="********"
                                    [(ngModel)]="userData.password" required>
                                <span class="eye_view eye_sec">
                                    <i class="fa-solid fa-eye"></i>
                                </span>
                                <span class="eye_view_slas eye_sec d-none">
                                    <i class="fa-solid fa-eye-slash"></i>
                                </span>
                            </div>
                        </div>
                        <div class="text-right forget-pass">
                            <a routerLink="/forgot-password">Forget Password?</a>
                        </div>
                        <div class="text-center login_btn_section mt-4">
                            <input type="submit" class="btn btn-success login_btn" value="Login">
                        </div>
                    </form>
                </div>
                <!-- OTP Login Form -->
                <div class="tab-pane fade d-none" id="otp" role="tabpanel" aria-labelledby="otp-tab">
                    <form name="otpForm" #otpF="ngForm" (ngSubmit)="otpF.form.valid && handleOTPSubmit(otpData)">
                        <!-- Mobile Number Input (Step 1) -->
                        <div class="col-5">
                            <label for="mobile">Enter Mobile Number : </label>
                            <input type="text" class="form-control" name="mobile" required [(ngModel)]="otpData.mobile"
                                placeholder="Enter OTP" #mobile="ngModel" />
                            <div *ngIf="otpF.submitted && mobile.errors?.['required']" class="text-danger">
                                Mobile number is required
                            </div>

                        </div>

                        <!-- OTP Input (Step 2) -->
                        <div *ngIf="otpSent" class="col-5">
                            <label for="otp">Enter OTP : </label>
                            <input type="text" class="form-control" name="otp" required [(ngModel)]="otpData.otp"
                                placeholder="Enter OTP" #otp="ngModel" />
                            <div *ngIf="otpF.submitted && otp?.errors?.['required'] && otpSent" class="text-danger">
                                OTP is required
                            </div>
                        </div>

                        <!-- Submit Button -->
                        <div class="text-center">
                            <input *ngIf="!otpSent" type="submit" class="btn btn-primary" value="Send OTP" />
                            <input *ngIf="otpSent" type="submit" class="btn btn-success" value="Verify OTP" />&nbsp;
                            <!--<input *ngIf="otpSent" type="button" class="btn btn-success" value="Resend Otp" />-->
                        </div>
                    </form>
                </div>
            </div>
            <!-- Sign-up Link 
                <div class="text-center sign-up">
                    Don’t have an account? <a routerLink="/sign-up">Sign Up</a> here.
                </div>-->
        </div>
    </div>
</div>
