<div class="row login reset-password">
  <div class="col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-sm-12 col-xs-12">
    <div class="grid_main auth">
      <div class="card-body auth-card">
        <div class="auth-avatar">
          <img
            src="https://pluspng.com/img-png/user-png-icon-account-avatar-human-male-man-men-people-person-download-svg-download-png-edit-icon-512.png"
            alt="user" class="user-image">
        </div>
        <form name="form" #f="ngForm" (ngSubmit)="f.valid && signUp()">
          <div class="col-5">
            <label for="password">Password:</label>
            <input type="password" name="password" class="form-control" placeholder="********"
              [(ngModel)]="userData.password" #password="ngModel" required
              [ngClass]="{ 'is-invalid': f.submitted && password.errors }">
            <div *ngIf="f.submitted && password.errors" class="invalid-feedback my-text">
              <div *ngIf="password.errors['required']">Password is required</div>
            </div>
          </div>
          <div class="col-5">
            <label for="c_password">Confirm Password:</label>
            <input type="password" name="cpassword" class="form-control" placeholder="********"
              [(ngModel)]="userData.cpassword" #cpassword="ngModel" required mustMatch="password"
              [ngClass]="{ 'is-invalid': f.submitted && cpassword.errors }">
            <div *ngIf="f.submitted && cpassword.errors?.['mustMatch']" class="invalid-feedback my-text">
              Passwords must match.
            </div>
            <div *ngIf="f.submitted && cpassword.errors?.['required']" class="invalid-feedback my-text">
              Confirm password is required.
            </div>
          </div>

          <div class="text-center">
            <input type="submit" class="btn btn-primary" value="Submit">
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
