<div class="chart"  [class.blur-page]="showPayuOverlay">
    <div class="col-12 pg-sections">
        <div class="row mb-3">
            <div class="page-headding">
                <h1>Welcome, <span>Super Admin</span></h1>
            </div>
        </div>
        <div class="row mb-3">
            <div class="col-xxl-3 col-xl-3 col-lg-4 col-md-6 col-sm-12 col-xs-12 mb-3">
                <div class="grid_main" style="background:var(--card-my);">
                    <div class="card-box">
                        <div class="card-title">My Wallet</div>

                        
                        <div class="card-balance">₹ —</div>
                        <div class="mt-4">
                            <a class="btn btn-danger btn-sm" href="">Payout</a>
                        </div>
                    </div>

                    
   <button (click)="pay()">Cashfree</button>
   
                </div>
            </div>
        
        </div>
    </div>
</div>

<!-- Overlay -->
<div class="payu-overlay" *ngIf="showPayuOverlay">
  <div class="payu-msg">
    <h3>Complete Payment</h3>
    <p>Do not close this window</p>
  </div>
</div>
